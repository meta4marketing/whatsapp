/*

db.collection("leads")

                        deleteButton

                    row.appendChild(
                        actionCell
                    );

                        row

    );



/* =========================================
   CREATE TABLE CELL
========================================= */

function createCell(value) {

    const cell =
        document.createElement("td");


    cell.textContent =
        value || "";


    return cell;

}



/* =========================================
   STATUS BADGE
========================================= */

function createStatusBadge(status) {

    if(!status) {

        return "";

    }


    const lower =
        status.toLowerCase();


    let badge =
        "bg-secondary";


    if(lower === "new") {

        badge =
            "bg-primary";

    }


    else if(lower === "interested") {

        badge =
            "bg-success";

    }


    else if(lower === "followup") {

        badge =
            "bg-warning text-dark";

    }


    else if(lower === "not interested") {

        badge =
            "bg-danger";

    }


    else if(lower === "converted") {

        badge =
            "bg-success";

    }


    return `

        <span class="badge ${badge}">

            ${escapeHtml(status)}

        </span>

    `;

}

}

/* =========================================

async function deleteLead(id) {


    const confirmed =
        confirm(
            "Are you sure you want to delete this lead?"
        );


    if(!confirmed) {

        return;

    }


    try {


        await db
            .collection("leads")
            .doc(id)
            .delete();


        alert(
            "Lead deleted successfully!"
        );

            error

        alert(

/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value) {


    if(
        value === undefined ||
        value === null
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
