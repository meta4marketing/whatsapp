<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lead Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"></script>
</head>
<body class="p-5">

<div class="card shadow p-4 mb-4">
  <h2 class="mb-4">Lead Tracker</h2>
  <form id="leadForm">
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Business Name</label>
        <input type="text" id="businessName" class="form-control" required>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Address</label>
        <input type="text" id="address" class="form-control" required>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Phone</label>
        <input type="text" id="phone" class="form-control" required>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Call Date</label>
        <input type="date" id="callDate" class="form-control">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Call Result</label>
        <input type="text" id="callResult" class="form-control">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">WhatsApp Sent</label>
        <input type="text" id="whatsappSent" class="form-control">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">WhatsApp Seen</label>
        <input type="text" id="whatsappSeen" class="form-control">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Followup Date</label>
        <input type="date" id="followupDate" class="form-control">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Lead Status</label>
        <input type="text" id="leadStatus" class="form-control">
      </div>
      <div class="col-md-12 mb-3">
        <label class="form-label">Notes</label>
        <textarea id="notes" class="form-control"></textarea>
      </div>
    </div>
    <button type="submit" class="btn btn-primary">Save Lead</button>
  </form>
</div>

<!-- Table -->
<div class="card shadow p-4">
  <h3 class="mb-3">Leads Table</h3>
  <table class="table table-bordered" id="leadsTable">
    <thead>
      <tr>
        <th>Business Name</th>
        <th>Address</th>
        <th>Phone</th>
        <th>Call Date</th>
        <th>Call Result</th>
        <th>WhatsApp Sent</th>
        <th>WhatsApp Seen</th>
        <th>Followup Date</th>
        <th>Lead Status</th>
        <th>Notes</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<!-- Edit Modal -->
<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Edit Lead</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="editForm">
          <input type="hidden" id="editId">
          <div class="row">
            <div class="col-md-6 mb-3"><input type="text" id="editBusinessName" class="form-control" placeholder="Business Name"></div>
            <div class="col-md-6 mb-3"><input type="text" id="editAddress" class="form-control" placeholder="Address"></div>
            <div class="col-md-6 mb-3"><input type="text" id="editPhone" class="form-control" placeholder="Phone"></div>
            <div class="col-md-6 mb-3"><input type="date" id="editCallDate" class="form-control"></div>
            <div class="col-md-6 mb-3"><input type="text" id="editCallResult" class="form-control" placeholder="Call Result"></div>
            <div class="col-md-6 mb-3"><input type="text" id="editWhatsappSent" class="form-control" placeholder="WhatsApp Sent"></div>
            <div class="col-md-6 mb-3"><input type="text" id="editWhatsappSeen" class="form-control" placeholder="WhatsApp Seen"></div>
            <div class="col-md-6 mb-3"><input type="date" id="editFollowupDate" class="form-control"></div>
            <div class="col-md-6 mb-3"><input type="text" id="editLeadStatus" class="form-control" placeholder="Lead Status"></div>
            <div class="col-md-12 mb-3"><textarea id="editNotes" class="form-control" placeholder="Notes"></textarea></div>
          </div>
          <button type="submit" class="btn btn-success">Update Lead</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // 🔹 Firebase Config (replace with your project credentials)
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "your-project-id.firebaseapp.com",
    projectId: "your-project-id",
    storageBucket: "your-project-id.appspot.com",
    messagingSenderId: "SENDER_ID",
    appId: "APP_ID"
  };

  const app = firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const form = document.getElementById("leadForm");
  const tableBody = document.getElementById("tableBody");
  const editForm = document.getElementById("editForm");

  // Save Lead
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    await db.collection("leads").add({
      businessName: document.getElementById("businessName").value,
      address: document.getElementById("address").value,
      phone: document.getElementById("phone").value,
      callDate: document.getElementById("callDate").value,
      callResult: document.getElementById("callResult").value,
      whatsappSent: document.getElementById("whatsappSent").value,
      whatsappSeen: document.getElementById("whatsappSeen").value,
      followupDate: document.getElementById("followupDate").value,
      leadStatus: document.getElementById("leadStatus").value,
      notes: document.getElementById("notes").value,
      createdAt: new Date()
    });
    form.reset();
  });

  // Fetch + Show Table
  db.collection("leads").onSnapshot((snapshot) => {
    tableBody.innerHTML = "";
    snapshot.forEach((doc) => {
      const data = doc.data();
      const row = `
        <tr>
          <td>${data.businessName}</td>
          <td>${data.address}</td>

          <td>${data.whatsappSent}</td>
          <td>${data.whatsappSeen}</td>
          <td>${data.followupDate}</td>
          <td>${data.leadStatus}</td>
          <td>${data.notes}</td>
          <td>
            <button class="btn btn-sm btn-warning" onclick="openEdit('${doc.id}', ${JSON.stringify(data).replace(/"/g,'&quot;')})">Edit</button>
