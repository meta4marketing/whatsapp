<script>


/* =====================================================
   FIREBASE CONFIG
====================================================== */

const firebaseConfig = {

    apiKey: "AIzaSyAmeouRGrSiGMU-OaMtaKghNPUWSCtTgtQ",

    authDomain: "studio-9765353447-3bfaa.firebaseapp.com",

    projectId: "studio-9765353447-3bfaa",

    storageBucket: "studio-9765353447-3bfaa.firebasestorage.app",

    messagingSenderId: "623664784322",

    appId: "1:623664784322:web:e368268faea94a3b046c5b"

};



/* =====================================================
   INITIALIZE FIREBASE
====================================================== */

firebase.initializeApp(firebaseConfig);


const auth =
    firebase.auth();


const db =
    firebase.firestore();



/* =====================================================
   DOM ELEMENTS
====================================================== */

const loginSection =
    document.getElementById("loginSection");


const appSection =
    document.getElementById("appSection");


const loginForm =
    document.getElementById("loginForm");


const loginButton =
    document.getElementById("loginButton");


const loginError =
    document.getElementById("loginError");


const logoutButton =
    document.getElementById("logoutButton");


const loggedInUser =
    document.getElementById("loggedInUser");


const leadForm =
    document.getElementById("leadForm");


const tableBody =
    document.getElementById("tableBody");


const leadCount =
    document.getElementById("leadCount");


const editForm =
    document.getElementById("editForm");


const editModalElement =
    document.getElementById("editModal");


const editModal =
    new bootstrap.Modal(
        editModalElement
    );



/* =====================================================
   LOGIN
====================================================== */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        loginError.classList.add(
            "d-none"
        );


        const email =
            document
            .getElementById(
                "loginEmail"
            )
            .value
            .trim();


        const password =
            document
            .getElementById(
                "loginPassword"
            )
            .value;


        try {


            loginButton.disabled =
                true;


            loginButton.innerText =
                "Logging in...";


            await auth.signInWithEmailAndPassword(
                email,
                password
            );


        }

        catch(error) {


            console.error(
                "Login Error:",
                error
            );


            let message =
                "Login failed.";


            if(
                error.code ===
                "auth/invalid-login-credentials"
            ) {

                message =
                    "Email or password is incorrect.";

            }


            else if(
                error.code ===
                "auth/user-not-found"
            ) {

                message =
                    "User not found.";

            }


            else if(
                error.code ===
                "auth/wrong-password"
            ) {

                message =
                    "Wrong password.";

            }


            else if(
                error.code ===
                "auth/invalid-email"
            ) {

                message =
                    "Invalid email address.";

            }


            else {

                message =
                    error.message;

            }


            loginError.textContent =
                message;


            loginError.classList.remove(
                "d-none"
            );

        }


        finally {


            loginButton.disabled =
                false;


            loginButton.innerText =
                "Login";

        }

    }
);



/* =====================================================
   AUTH STATE
====================================================== */

auth.onAuthStateChanged(
    function(user) {


        if(user) {


            /* User logged in */

            loginSection.style.display =
                "none";


            appSection.style.display =
                "block";


            loggedInUser.textContent =
                "Logged in as: " +
                user.email;


            loadLeads(
                user.uid
            );

        }

        else {


            /* User logged out */

            loginSection.style.display =
                "block";


            appSection.style.display =
                "none";


            loggedInUser.textContent =
                "";


            tableBody.innerHTML =
                "";

        }

    }
);



/* =====================================================
   LOGOUT
====================================================== */

logoutButton.addEventListener(
    "click",
    async function() {


        try {


            await auth.signOut();


        }

        catch(error) {


            console.error(
                "Logout Error:",
                error
            );


            alert(
                "Logout failed:\n\n" +
                error.message
            );

        }

    }
);



/* =====================================================
   ADD LEAD
====================================================== */

leadForm.addEventListener(
    "submit",
    async function(event) {


        event.preventDefault();


        const user =
            auth.currentUser;


        if(!user) {


            alert(
                "Please login first."
            );


            return;

        }


        const saveButton =
            document.getElementById(
                "saveButton"
            );


        try {


            saveButton.disabled =
                true;


            saveButton.innerText =
                "Saving...";


            const leadData = {


                businessName:
                    document
                    .getElementById(
                        "businessName"
                    )
                    .value
                    .trim(),


                address:
                    document
                    .getElementById(
                        "address"
                    )
                    .value
                    .trim(),


                phone:
                    document
                    .getElementById(
                        "phone"
                    )
                    .value
                    .trim(),


                callDate:
                    document
                    .getElementById(
                        "callDate"
                    )
                    .value,


                callResult:
                    document
                    .getElementById(
                        "callResult"
                    )
                    .value
                    .trim(),


                whatsappSent:
                    document
                    .getElementById(
                        "whatsappSent"
                    )
                    .value
                    .trim(),


                whatsappSeen:
                    document
                    .getElementById(
                        "whatsappSeen"
                    )
                    .value
                    .trim(),


                followupDate:
                    document
                    .getElementById(
                        "followupDate"
                    )
                    .value,


                leadStatus:
                    document
                    .getElementById(
                        "leadStatus"
                    )
                    .value
                    .trim(),


                notes:
                    document
                    .getElementById(
                        "notes"
                    )
                    .value
                    .trim(),


                /* IMPORTANT */

                userId:
                    user.uid,


                createdAt:
                    firebase.firestore.FieldValue
                    .serverTimestamp()

            };


            await db
                .collection("leads")
                .add(
                    leadData
                );


            alert(
                "Lead saved successfully!"
            );


            leadForm.reset();


        }

        catch(error) {


            console.error(
                "Save Error:",
                error
            );


            alert(
                "Error saving lead:\n\n" +
                error.message
            );

        }


        finally {


            saveButton.disabled =
                false;


            saveButton.innerText =
                "Save Lead";

        }

    }
);



/* =====================================================
   LOAD ONLY CURRENT USER LEADS
====================================================== */

function loadLeads(userId) {


    db.collection("leads")
        .where(
            "userId",
            "==",
            userId
        )
        .onSnapshot(


            function(snapshot) {


                tableBody.innerHTML =
                    "";


                leadCount.textContent =
                    snapshot.size +
                    (
                        snapshot.size === 1
                        ? " Lead"
                        : " Leads"
                    );


                if(
                    snapshot.empty
                ) {


                    tableBody.innerHTML = `

                        <tr>

                            <td
                                colspan="11"
                                class="text-center text-muted py-4"
                            >
                                No leads found.
                            </td>

                        </tr>

                    `;


                    return;

                }


                snapshot.forEach(
                    function(doc) {


                        const data =
                            doc.data();


                        const row =
                            document
                            .createElement(
                                "tr"
                            );


                        /* Business */

                        row.appendChild(
                            createCell(
                                data.businessName
                            )
                        );


                        /* Address */

                        row.appendChild(
                            createCell(
                                data.address
                            )
                        );


                        /* Phone */

                        const phoneCell =
                            document
                            .createElement(
                                "td"
                            );


                        if(
                            data.phone
                        ) {


                            const phoneLink =
                                document
                                .createElement(
                                    "a"
                                );


                            phoneLink.href =
                                "tel:" +
                                data.phone;


                            phoneLink.textContent =
                                data.phone;


                            phoneLink.className =
                                "phone-link";


                            phoneCell
                                .appendChild(
                                    phoneLink
                                );

                        }


                        row.appendChild(
                            phoneCell
                        );


                        /* Call Date */

                        row.appendChild(
                            createCell(
                                data.callDate
                            )
                        );


                        /* Call Result */

                        row.appendChild(
                            createCell(
                                data.callResult
                            )
                        );


                        /* WhatsApp Sent */

                        row.appendChild(
                            createCell(
                                data.whatsappSent
                            )
                        );


                        /* WhatsApp Seen */

                        row.appendChild(
                            createCell(
                                data.whatsappSeen
                            )
                        );


                        /* Followup */

                        row.appendChild(
                            createCell(
                                data.followupDate
                            )
                        );


                        /* Status */

                        const statusCell =
                            document
                            .createElement(
                                "td"
                            );


                        statusCell.innerHTML =
                            createStatusBadge(
                                data.leadStatus
                            );


                        row.appendChild(
                            statusCell
                        );


                        /* Notes */

                        row.appendChild(
                            createCell(
                                data.notes
                            )
                        );


                        /* Action */

                        const actionCell =
                            document
                            .createElement(
                                "td"
                            );


                        actionCell.className =
                            "action-buttons";


                        /* Edit */

                        const editButton =
                            document
                            .createElement(
                                "button"
                            );


                        editButton.type =
                            "button";


                        editButton.className =
                            "btn btn-sm btn-warning me-1";


                        editButton.textContent =
                            "Edit";


                        editButton.addEventListener(
                            "click",
                            function() {


                                openEdit(
                                    doc.id,
                                    data
                                );


                            }
                        );


                        /* Delete */

                        const deleteButton =
                            document
                            .createElement(
                                "button"
                            );


                        deleteButton.type =
                            "button";


                        deleteButton.className =
                            "btn btn-sm btn-danger";


                        deleteButton.textContent =
                            "Delete";


                        deleteButton.addEventListener(
                            "click",
                            function() {


                                deleteLead(
                                    doc.id
                                );


                            }
                        );


                        actionCell
                            .appendChild(
                                editButton
                            );


                        actionCell
                            .appendChild(
                                deleteButton
                            );


                        row.appendChild(
                            actionCell
                        );


                        tableBody
                            .appendChild(
                                row
                            );

                    }
                );

            },


            function(error) {


                console.error(
                    "Firestore Error:",
                    error
                );


                tableBody.innerHTML = `

                    <tr>

                        <td
                            colspan="11"
                            class="text-center text-danger py-4"
                        >

                            Firestore Error:

                            <br>

                            ${escapeHtml(
                                error.message
                            )}

                        </td>

                    </tr>

                `;

            }

        );

}



/* =====================================================
   CREATE TABLE CELL
====================================================== */

function createCell(value) {


    const cell =
        document
        .createElement(
            "td"
        );


    cell.textContent =
        value || "";


    return cell;

}



/* =====================================================
   STATUS BADGE
====================================================== */

function createStatusBadge(
    status
) {


    if(!status) {

        return "";

    }


    const lower =
        status
        .toLowerCase();


    let badge =
        "bg-secondary";


    if(
        lower === "new"
    ) {

        badge =
            "bg-primary";

    }


    else if(
        lower === "interested"
    ) {

        badge =
            "bg-success";

    }


    else if(
        lower === "followup"
    ) {

        badge =
            "bg-warning text-dark";

    }


    else if(
        lower === "not interested"
    ) {

        badge =
            "bg-danger";

    }


    else if(
        lower === "converted"
    ) {

        badge =
            "bg-success";

    }


    return `

        <span
            class="badge ${badge}"
        >
            ${escapeHtml(status)}
        </span>

    `;

}

/* =====================================================
   UPDATE LEAD
====================================================== */

editForm.addEventListener(
    "submit",
    async function(event) {


        event.preventDefault();


        const user =
            auth.currentUser;


        if(!user) {


            alert(
                "Please login first."
            );


            return;

        }


        const id =
            document.getElementById(
                "editId"
            ).value;


        try {


            const updatedData = {


                businessName:
                    document
                    .getElementById(
                        "editBusinessName"
                    )
                    .value
                    .trim(),


                address:
                    document
                    .getElementById(
                        "editAddress"
                    )
                    .value
                    .trim(),


                phone:
                    document
                    .getElementById(
                        "editPhone"
                    )
                    .value
                    .trim(),


                callDate:
                    document
                    .getElementById(
                        "editCallDate"
                    )
                    .value,


                callResult:
                    document
                    .getElementById(
                        "editCallResult"
                    )
                    .value
                    .trim(),


                whatsappSent:
                    document
                    .getElementById(
                        "editWhatsappSent"
                    )
                    .value
                    .trim(),


                whatsappSeen:
                    document
                    .getElementById(
                        "editWhatsappSeen"
                    )
                    .value
                    .trim(),


                followupDate:
                    document
                    .getElementById(
                        "editFollowupDate"
                    )
                    .value,


                leadStatus:
                    document
                    .getElementById(
                        "editLeadStatus"
                    )
                    .value
                    .trim(),


                notes:
                    document
                    .getElementById(
                        "editNotes"
                    )
                    .value
                    .trim(),


                /* Keep same user */

                userId:
                    user.uid,


                updatedAt:
                    firebase.firestore.FieldValue
                    .serverTimestamp()

            };


            await db
                .collection("leads")
                .doc(id)
                .update(
                    updatedData
                );


            alert(
                "Lead updated successfully!"
            );


            editModal.hide();


        }

        catch(error) {


            console.error(
                "Update Error:",
                error
            );


            alert(
                "Error updating lead:\n\n" +
                error.message
            );

        }

    }
);



/* =====================================================
   DELETE LEAD
====================================================== */

async function deleteLead(
    id
) {


    const confirmed =
        confirm(
            "Are you sure you want to delete this lead?"
        );


    if(!confirmed) {

        return;

    }


    const user =
        auth.currentUser;


    if(!user) {


        alert(
            "Please login first."
        );


        return;

    }


    try {


        await db
            .collection("leads")
            .doc(id)
            .delete();


        alert(
            "Lead deleted successfully!"
        );


    }

    catch(error) {


        console.error(
            "Delete Error:",
            error
        );


        alert(
            "Error deleting lead:\n\n" +
            error.message
        );

    }

}



/* =====================================================
   ESCAPE HTML
====================================================== */

function escapeHtml(
    value
) {


    if(
        value === undefined ||
        value === null
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
