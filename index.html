/* =====================================================
NORMALIZE PHONE
====================================================== */

function normalizePhone(phone) {

    if(!phone) {
        return "";
    }


    let value =
    String(phone)
    .replace(/\D/g, "");


    if(value.startsWith("0")) {

        value =
        value.substring(1);

    }


    if(value.length === 10) {

        value =
        "91" + value;

    }


    return value;

}



/* =====================================================
NORMALIZE TEXT
====================================================== */

function normalizeText(value) {

    if(!value) {
        return "";
    }


    return String(value)
    .trim()
    .toLowerCase()
    .replace(/\s+/g, " ");

}



/* =====================================================
CHECK DUPLICATE
====================================================== */

function findDuplicateLead(
    businessName,
    address,
    phone,
    excludeId = null
) {

    const newName =
    normalizeText(businessName);

    const newAddress =
    normalizeText(address);

    const newPhone =
    normalizePhone(phone);


    for(const lead of allLeads) {

        if(
            excludeId &&
            lead.id === excludeId
        ) {

            continue;

        }


        const oldName =
        normalizeText(
            lead.data.businessName
        );

        const oldAddress =
        normalizeText(
            lead.data.address
        );

        const oldPhone =
        normalizePhone(
            lead.data.phone
        );


        /* Same phone */

        if(
            newPhone &&
            oldPhone &&
            newPhone === oldPhone
        ) {

            return {
                type: "phone",
                lead: lead
            };

        }


        /* Same business name + address */

        if(
            newName &&
            newAddress &&
            oldName &&
            oldAddress &&
            newName === oldName &&
            newAddress === oldAddress
        ) {

            return {
                type: "nameAddress",
                lead: lead
            };

        }

    }


    return null;

}

            .getElementById("notes")
            .value
            .trim(),

/* =====================================================
LOAD ONLY CURRENT USER LEADS
====================================================== */

function loadLeads(userId) {


    if(unsubscribeLeads) {

        unsubscribeLeads();

    }


    unsubscribeLeads =
    db
    .collection("leads")
    .where(
        "userId",
        "==",
        userId
    )
    .onSnapshot(

        function(snapshot) {


            allLeads = [];


            snapshot.forEach(
            function(doc) {

                allLeads.push({

                    id: doc.id,

                    data: doc.data()

                });

            });



            /* =========================================
               SORT NEWEST FIRST
            ========================================== */

            allLeads.sort(
            function(a,b) {

                const aTime =
                a.data.createdAt &&
                a.data.createdAt.toMillis
                ? a.data.createdAt.toMillis()
                : 0;


                const bTime =
                b.data.createdAt &&
                b.data.createdAt.toMillis
                ? b.data.createdAt.toMillis()
                : 0;


                return bTime - aTime;

            });



            leadCount.textContent =
            allLeads.length +
            (
                allLeads.length === 1
                ? " Lead"
                : " Leads"
            );



            /* =========================================
               APPLY SEARCH
            ========================================== */

            applySearch();

        },


        function(error) {

            console.error(
                "Firestore Error:",
                error
            );


            tableBody.innerHTML = `

                <tr>

                    <td
                    colspan="11"
                    class="text-center text-danger py-4"
                    >

                        Firestore Error:

                        <br>

                        ${escapeHtml(error.message)}

                    </td>

                </tr>

            `;

        }

    );

}



/* =====================================================
SEARCH
====================================================== */

searchInput.addEventListener(
"input",
function() {

    currentPage = 1;

    applySearch();

});



/* =====================================================
CLEAR SEARCH
====================================================== */

clearSearch.addEventListener(
"click",
function() {

    searchInput.value = "";

    currentPage = 1;

    applySearch();

});



/* =====================================================
APPLY SEARCH
====================================================== */

function applySearch() {


    const searchTerm =
    normalizeText(
        searchInput.value
    );


    if(!searchTerm) {

        filteredLeads =
        [...allLeads];

    }

    else {

        filteredLeads =
        allLeads.filter(
        function(lead) {


            const data =
            lead.data;


            const name =
            normalizeText(
                data.businessName
            );


            const address =
            normalizeText(
                data.address
            );


            const phone =
            normalizeText(
                data.phone
            );


            return (

                name.includes(searchTerm) ||

                address.includes(searchTerm) ||

                phone.includes(searchTerm)

            );

        });

    }


    renderTable();

}



/* =====================================================
RENDER TABLE
====================================================== */

function renderTable() {


    tableBody.innerHTML = "";


    if(filteredLeads.length === 0) {

        tableBody.innerHTML = `

            <tr>

                <td
                colspan="11"
                class="text-center text-muted py-4"
                >

                    ${
                        searchInput.value.trim()
                        ? "No matching leads found."
                        : "No leads found."
                    }

                </td>

            </tr>

        `;


        renderPagination();

        return;

    }



    /* =================================================
       CALCULATE PAGINATION
    ================================================== */

    const totalPages =
    Math.ceil(
        filteredLeads.length /
        leadsPerPage
    );


    if(
        currentPage > totalPages
    ) {

        currentPage =
        totalPages;

    }


    const startIndex =
    (currentPage - 1) *
    leadsPerPage;


    const endIndex =
    startIndex +
    leadsPerPage;


    const pageLeads =
    filteredLeads.slice(
        startIndex,
        endIndex
    );



    /* =================================================
       CREATE ROWS
    ================================================== */

    pageLeads.forEach(
    function(lead) {


        const docId =
        lead.id;

        const data =
        lead.data;


        const row =
        document.createElement("tr");



        /* BUSINESS */

        row.appendChild(
            createCell(
                data.businessName
            )
        );



        /* ADDRESS */

        row.appendChild(
            createCell(
                data.address
            )
        );



        /* PHONE */

        const phoneCell =
        document.createElement("td");


        if(data.phone) {

            const phoneLink =
            document.createElement("a");


            phoneLink.href =
            "tel:" + data.phone;


            phoneLink.textContent =
            data.phone;


            phoneLink.className =
            "phone-link";


            phoneCell.appendChild(
                phoneLink
            );

        }


        row.appendChild(
            phoneCell
        );



        /* CALL DATE */

        row.appendChild(
            createCell(
                data.callDate
            )
        );



        /* CALL RESULT */

        row.appendChild(
            createCell(
                data.callResult
            )
        );



        /* WHATSAPP SENT */

        row.appendChild(
            createCell(
                data.whatsappSent
            )
        );



        /* WHATSAPP SEEN */

        row.appendChild(
            createCell(
                data.whatsappSeen
            )
        );



        /* FOLLOWUP */

        row.appendChild(
            createCell(
                data.followupDate
            )
        );



        /* STATUS */

        const statusCell =
        document.createElement("td");


        statusCell.innerHTML =
        createStatusBadge(
            data.leadStatus
        );


        row.appendChild(
            statusCell
        );



        /* NOTES */

        row.appendChild(
            createCell(
                data.notes
            )
        );



        /* ACTION */

        const actionCell =
        document.createElement("td");


        actionCell.className =
        "action-buttons";



        /* =============================================
           WHATSAPP BUTTON
        ============================================== */

        const whatsappButton =
        document.createElement("button");


        whatsappButton.type =
        "button";


        whatsappButton.className =
        "btn btn-sm btn-success me-1 mb-1";


        whatsappButton.innerHTML =
        "💬 WhatsApp";


        whatsappButton.addEventListener(
        "click",
        function() {


            if(!data.phone) {

                alert(
                    "This lead does not have a phone number."
                );

                return;

            }


            let phone =
            String(data.phone)
            .replace(/\D/g, "");


            if(phone.startsWith("0")) {

                phone =
                phone.substring(1);

            }


            if(phone.length === 10) {

                phone =
                "91" + phone;

            }


            const message =
            `Hello ${
                data.businessName || ""
            }, I am contacting you regarding your business website.`;


            const whatsappURL =
            "https://wa.me/" +
            phone +
            "?text=" +
            encodeURIComponent(message);


            window.open(
                whatsappURL,
                "_blank"
            );

        });



        /* =============================================
           EDIT BUTTON
        ============================================== */

        const editButton =
        document.createElement("button");


        editButton.type =
        "button";


        editButton.className =
        "btn btn-sm btn-warning me-1 mb-1";


        editButton.textContent =
        "Edit";


        editButton.addEventListener(
        "click",
        function() {

            openEdit(
                docId,
                data
            );

        });



        /* =============================================
           DELETE BUTTON
        ============================================== */

        const deleteButton =
        document.createElement("button");


        deleteButton.type =
        "button";


        deleteButton.className =
        "btn btn-sm btn-danger mb-1";


        deleteButton.textContent =
        "Delete";


        deleteButton.addEventListener(
        "click",
        function() {

            deleteLead(
                docId
            );

        });



        /* ADD BUTTONS */

        actionCell.appendChild(
            whatsappButton
        );


        actionCell.appendChild(
            editButton
        );


        actionCell.appendChild(
            deleteButton
        );


        row.appendChild(
            actionCell
        );


        tableBody.appendChild(
            row
        );

    });



    renderPagination();

}



/* =====================================================
PAGINATION
====================================================== */

function renderPagination() {


    pagination.innerHTML = "";


    const totalPages =
    Math.ceil(
        filteredLeads.length /
        leadsPerPage
    );


    if(totalPages <= 1) {

        return;

    }



    /* =============================================
       PREVIOUS
    ============================================== */

    const previousButton =
    document.createElement("button");


    previousButton.className =
    "btn btn-outline-primary btn-sm";


    previousButton.textContent =
    "‹ Previous";


    previousButton.disabled =
    currentPage === 1;


    previousButton.addEventListener(
    "click",
    function() {

        if(currentPage > 1) {

            currentPage--;

            renderTable();

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }

    });


    pagination.appendChild(
        previousButton
    );



    /* =============================================
       PAGE NUMBERS
    ============================================== */

    for(
        let page = 1;
        page <= totalPages;
        page++
    ) {


        const pageButton =
        document.createElement("button");


        pageButton.className =
        "btn btn-sm " +
        (
            page === currentPage
            ? "btn-primary"
            : "btn-outline-primary"
        );


        pageButton.textContent =
        page;


        pageButton.addEventListener(
        "click",
        function() {

            currentPage =
            page;

            renderTable();

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        });


        pagination.appendChild(
            pageButton
        );

    }



    /* =============================================
       NEXT
    ============================================== */

    const nextButton =
    document.createElement("button");


    nextButton.className =
    "btn btn-outline-primary btn-sm";


    nextButton.textContent =
    "Next ›";


    nextButton.disabled =
    currentPage === totalPages;


    nextButton.addEventListener(
    "click",
    function() {

        if(
            currentPage <
            totalPages
        ) {

            currentPage++;

            renderTable();

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }

    });


    pagination.appendChild(
        nextButton
    );



    /* =============================================
       PAGE INFO
    ============================================== */

    const info =
    document.createElement("span");


    info.className =
    "page-info ms-2";


    info.textContent =
    "Page " +
    currentPage +
    " of " +
    totalPages;


    pagination.appendChild(
        info
    );

}



/* =====================================================
CREATE TABLE CELL
====================================================== */

function createCell(value) {

    const cell =
    document.createElement("td");


    cell.textContent =
    value || "";


    return cell;

}



/* =====================================================
STATUS BADGE
====================================================== */

function createStatusBadge(status) {


    if(!status) {

        return "";

    }


    const lower =
    status.toLowerCase();


    let badge =
    "bg-secondary";


    if(lower === "new") {

        badge =
        "bg-primary";

    }

    else if(
        lower === "interested"
    ) {

        badge =
        "bg-success";

    }

    else if(
        lower === "followup"
    ) {

        badge =
        "bg-warning text-dark";

    }

    else if(
        lower === "not interested"
    ) {

        badge =
        "bg-danger";

    }

    else if(
        lower === "converted"
    ) {

        badge =
        "bg-success";

    }


    return `

        <span class="badge ${badge}">

            ${escapeHtml(status)}

        </span>

    `;

}

        return;

    }


    const user =
    auth.currentUser;


    if(!user) {

        alert(

        );

        return;

    }


    try {

        await db
        .collection("leads")
        .doc(id)
        .delete();


        alert(
            "Lead deleted successfully!"
        );

    }

    catch(error) {

        console.error(
            "Delete Error:",
            error
        );


        alert(
            "Error deleting lead:\n\n" +
            error.message
        );

    }

}



/* =====================================================
ESCAPE HTML
====================================================== */

function escapeHtml(value) {

    if(
        value === undefined ||
        value === null
    ) {

        return "";

    }


    return String(value)

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}

    );

        },
        2000
        );

    })

    .catch(
    function() {

        alert(
            "Text copy nahi ho paya."
        );

    });

}
